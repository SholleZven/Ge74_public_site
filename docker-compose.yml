services:

  nginx:
    image: nginx:alpine
    container_name: company_nginx
    ports:
      - "8080:80"
    volumes:
      - wordpress:/var/www/html

      # Наша тема
      - ./wp-content/themes/company-theme:/var/www/html/wp-content/themes/company-theme

      # Наш плагин
      - ./wp-content/plugins/company-core:/var/www/html/wp-content/plugins/company-core

      # Nginx config
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      wordpress:
        condition: service_started

  wordpress:
    image: wordpress:php8.3-fpm
    container_name: company_wordpress

    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - wordpress:/var/www/html

      # Наша тема
      - ./wp-content/themes/company-theme:/var/www/html/wp-content/themes/company-theme

      # Наш плагин
      - ./wp-content/plugins/company-core:/var/www/html/wp-content/plugins/company-core

    depends_on:
      database:
        condition: service_healthy

  database:
    image: mariadb:11
    container_name: company_database

    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - database:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  wpcli:
    image: wordpress:cli-php8.3
    container_name: company_wpcli

    user: "33:33"

    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

    volumes:
      - wordpress:/var/www/html

      # Наша тема
      - ./wp-content/themes/company-theme:/var/www/html/wp-content/themes/company-theme

      # Наш плагин
      - ./wp-content/plugins/company-core:/var/www/html/wp-content/plugins/company-core

    depends_on:
      database:
        condition: service_healthy

      wordpress:
        condition: service_started

volumes:

  wordpress:

  database: